        <script>
    const audio = document.getElementById('bg-music');
    const muteBtn = document.getElementById('mute-btn');

    // Handle mute button clicks
    muteBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play();
            muteBtn.textContent = '🔊 Mute';
            muteBtn.classList.remove('muted');
            sessionStorage.setItem('musicMuted', 'false');
        } else {
            audio.pause();
            muteBtn.textContent = '🔇 Unmute';
            muteBtn.classList.add('muted');
            sessionStorage.setItem('musicMuted', 'true');
        }
    });

    // 1. Check if music was already playing on the last page
    if (sessionStorage.getItem('musicPlaying') === 'true') {
        // Restore the exact second the music was at
        const savedTime = sessionStorage.getItem('musicTime');
        if (savedTime) audio.currentTime = parseFloat(savedTime);
        
        // Check if music was muted
        const wasMuted = sessionStorage.getItem('musicMuted') === 'true';
        if (wasMuted) {
            audio.pause();
            muteBtn.textContent = '🔇 Unmute';
            muteBtn.classList.add('muted');
        } else {
            // Try to resume playing automatically
            audio.play().catch(() => {
                // If the browser blocks it, wait for a click to resume
                document.addEventListener('click', () => audio.play(), { once: true });
            });
        }
    } else {
        // If it's their first time on the site, wait for a click to start
    document.addEventListener('click', () => {
    audio.play().then(() => {
        sessionStorage.setItem('musicPlaying', 'true');
    });
}, { once: true });
    }

    // 2. Constantly save the exact second of the song as it plays
    setInterval(() => {
        if (!audio.paused) {
            sessionStorage.setItem('musicTime', audio.currentTime);
        }
    }, 1000);

    // 3. Loop the music when it ends
    audio.addEventListener('ended', () => {
        audio.currentTime = 0;
        audio.play();
    }, false);
</script>

        <script src="featured-projects.js"></script>
