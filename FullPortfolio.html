<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Layla Green Final Portfolio Website</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

         <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body class="about-page">
        <header>
            <nav class="site-nav">
                <a href="index.html">Home</a>
                <a href="FullPortfolio.html">Full Portfolio</a>
                <a href="FeaturedProjects.html">Featured Projects</a>
                <a href="Reflection.html">Reflection</a>
                <a href="AboutMe.html">About Me</a>
                <a href="FuturePlans.html">Future Plans</a>
            </nav>
        </header>
        
        <main class="container mt-5">
            <h1 class="text-center green-text mb-4">My Projects</h1>
            
            <!-- Senior Year -->
            <section class="year-section mt-4">
                <h2 class="green-text">Senior Year</h2>
                <div class="projects-carousel-wrapper">
                    <div class="carousel-controls">
                        <button class="carousel-button" id="prev-senior" aria-label="Previous Senior">&#8249;</button>
                        <button class="carousel-button" id="next-senior" aria-label="Next Senior">&#8250;</button>
                    </div>
                    <div id="myprojects-senior" class="projects-carousel" data-year="Senior Year"></div>
                </div>
            </section>

            <!-- Junior Year -->
            <section class="year-section mt-5">
                <h2 class="green-text">Junior Year</h2>
                <div class="projects-carousel-wrapper">
                    <div class="carousel-controls">
                        <button class="carousel-button" id="prev-junior" aria-label="Previous Junior">&#8249;</button>
                        <button class="carousel-button" id="next-junior" aria-label="Next Junior">&#8250;</button>
                    </div>
                    <div id="myprojects-junior" class="projects-carousel" data-year="Junior Year"></div>
                </div>
            </section>

            <!-- Sophomore Year -->
            <section class="year-section mt-5 mb-4">
                <h2 class="green-text">Sophomore Year</h2>
                <div class="projects-carousel-wrapper">
                    <div class="carousel-controls">
                        <button class="carousel-button" id="prev-soph" aria-label="Previous Sophomore">&#8249;</button>
                        <button class="carousel-button" id="next-soph" aria-label="Next Sophomore">&#8250;</button>
                    </div>
                    <div id="myprojects-soph" class="projects-carousel" data-year="Sophomore Year"></div>
                </div>
            </section>
            
            <audio id="bg-music" loop>
                <source src="Gatsby-Music.mp3" type="audio/mpeg">
            </audio>
        </main>

        <footer>
                    </footer>

           <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <script>
        
            const audio = document.getElementById('bg-music');

            if (sessionStorage.getItem('musicPlaying') === 'true') {
                const savedTime = sessionStorage.getItem('musicTime');
                if (savedTime) audio.currentTime = parseFloat(savedTime);
                
                audio.play().catch(() => {
                    document.addEventListener('click', () => audio.play(), { once: true });
                });
            } else {
                document.addEventListener('click', () => {
                    audio.play();
                    sessionStorage.setItem('musicPlaying', 'true');
                }, { once: true });
            }

            setInterval(() => {
                if (!audio.paused) {
                    sessionStorage.setItem('musicTime', audio.currentTime);
                }
            }, 1000);
        </script>   
       
        <script src="script.js"></script>
    </body>
</html>
