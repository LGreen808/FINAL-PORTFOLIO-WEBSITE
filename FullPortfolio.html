        <script>
    const audio = document.getElementById('bg-music');

    // 1. Check if music was already playing on the last page
    if (sessionStorage.getItem('musicPlaying') === 'true') {
        // Restore the exact second the music was at
        const savedTime = sessionStorage.getItem('musicTime');
        if (savedTime) audio.currentTime = parseFloat(savedTime);
        
        // Try to resume playing automatically
        audio.play().catch(() => {
            // If the browser blocks it, wait for a click to resume
            document.addEventListener('click', () => audio.play(), { once: true });
        });
    } else {
        // If it's their first time on the site, wait for a click to start
        document.addEventListener('click', () => {
            audio.play();
            sessionStorage.setItem('musicPlaying', 'true');
        }, { once: true });
    }

    // 2. Constantly save the exact second of the song as it plays
    setInterval(() => {
        if (!audio.paused) {
            sessionStorage.setItem('musicTime', audio.currentTime);
        }
    }, 1000);
</script>
<script>
const container = document.getElementById('card-container');

    // 3. Loop through the JSON array and generate HTML for each item
    myData.forEach(item => {
        // Create a column wrapper for Bootstrap's grid
        const col = document.createElement('div');
        col.className = 'col';

        // Build the inner HTML structure of the card using template literals
        col.innerHTML = `
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <span class="badge bg-success mb-2">${item.category}</span>
                    <h5 class="card-title">${item.title}</h5>
                    <p class="card-text text-muted">${item.description}</p>
                </div>
                <div class="card-footer bg-transparent border-0 pb-3">
                    <a href="${item.link}" class="btn btn-outline-success w-100">View Project</a>
                </div>
            </div>
        `;

        // Append the newly created card into the container
        container.appendChild(col);
    });
</script>
</script>
